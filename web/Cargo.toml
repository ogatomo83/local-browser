[package]
name = "lb-web"
version = "0.1.0"
edition = "2024"
description = "モード C (静的ページ + フォルダを選ぶ) のブラウザ用 wasm。wasm-bindgen を使わず、JSON とバイト列だけでやりとりする"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lb-core = { path = "../core" }
lb-extract = { path = "../extract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
