<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Browser</title>
<meta name="description" content="フォルダを選ぶだけで、手元のドキュメントをブラウザの中だけで検索する">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='13' cy='13' r='8' fill='none' stroke='%232f6fd6' stroke-width='3.5'/><path d='M19 19l8 8' stroke='%232f6fd6' stroke-width='3.5' stroke-linecap='round'/></svg>">
<style>
:root {
  --bg: #ffffff;
  --chrome: #e8ebef;
  --chrome-2: #f3f5f7;
  --tab-active: #ffffff;
  --tab-hover: #f0f2f5;
  --line: #d6dbe1;
  --line-soft: #e8ebef;
  --text: #1d2329;
  --text-2: #56606b;
  --text-3: #8a939d;
  --accent: #2f6fd6;
  --accent-soft: #e6eefb;
  --link: #1a4fb3;
  --link-visited: #6a3fb0;
  --mark: #fff0a8;
  --mark-text: #1d2329;
  --code-bg: #f3f5f7;
  --ok: #2e9e5b;
  --busy: #d99a1c;
  --shadow: 0 8px 28px rgba(20, 30, 45, .14), 0 1px 3px rgba(20, 30, 45, .08);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191c; --chrome: #0f1113; --chrome-2: #1f2226; --tab-active: #17191c; --tab-hover: #1b1e22;
    --line: #2d3238; --line-soft: #24282d; --text: #e6e9ec; --text-2: #a9b1ba; --text-3: #737c86;
    --accent: #6da0ff; --accent-soft: #1d2a40; --link: #8db5ff; --link-visited: #c0a4f5;
    --mark: #6b5a12; --mark-text: #fff6cf; --code-bg: #1f2226; --shadow: 0 8px 28px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17191c; --chrome: #0f1113; --chrome-2: #1f2226; --tab-active: #17191c; --tab-hover: #1b1e22;
  --line: #2d3238; --line-soft: #24282d; --text: #e6e9ec; --text-2: #a9b1ba; --text-3: #737c86;
  --accent: #6da0ff; --accent-soft: #1d2a40; --link: #8db5ff; --link-visited: #c0a4f5;
  --mark: #6b5a12; --mark-text: #fff6cf; --code-bg: #1f2226; --shadow: 0 8px 28px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
svg { display: block; }

/* ---------- browser chrome ---------- */
#chrome { background: var(--chrome); flex: none; border-bottom: 1px solid var(--line); }
.tabstrip { display: flex; align-items: flex-end; gap: 2px; padding: 8px 8px 0; overflow-x: auto; scrollbar-width: none; }
.tabstrip::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 220px;
  height: 34px; padding: 0 6px 0 12px; border-radius: 9px 9px 0 0;
  color: var(--text-2); cursor: default; user-select: none; position: relative; font-size: 13px;
}
.tab:hover { background: var(--tab-hover); }
.tab.active { background: var(--tab-active); color: var(--text); box-shadow: 0 0 0 1px var(--line); clip-path: inset(-1px -1px 0 -1px); }
.tab .ico { flex: none; color: var(--text-3); }
.tab.active .ico { color: var(--accent); }
.tab .ttl { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab .x { flex: none; width: 20px; height: 20px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); cursor: pointer; }
.tab .x:hover { background: var(--line); color: var(--text); }
.newtab-btn { flex: none; width: 30px; height: 30px; margin: 0 0 2px 4px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text-2); }
.newtab-btn:hover { background: var(--tab-hover); }

.toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: var(--tab-active); }
.navbtn { width: 32px; height: 32px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--text-2); flex: none; }
.navbtn:hover:not(:disabled) { background: var(--chrome-2); }
.navbtn:disabled { opacity: .35; cursor: default; }
.omni { position: relative; flex: 1; min-width: 0; }
.omni-box { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--chrome-2); border: 1px solid transparent; }
.omni-box:focus-within { background: var(--bg); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.omni-box .scheme { color: var(--text-3); flex: none; }
.omni input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 14px; color: var(--text); }
.omni input::placeholder { color: var(--text-3); }
.suggest { position: absolute; left: 0; right: 0; top: 42px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px 0; z-index: 50; display: none; }
.suggest.open { display: block; }
.sg { display: flex; align-items: center; gap: 12px; padding: 7px 16px; cursor: pointer; font-size: 14px; }
.sg .ic { color: var(--text-3); flex: none; }
.sg .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg .p { color: var(--text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; padding-left: 12px; max-width: 45%; }
.sg.sel { background: var(--accent-soft); }

.status { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 10px; font-size: 12px; color: var(--text-3); flex: none; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.busy { background: var(--busy); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }

/* ---------- viewport ---------- */
#view { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: auto; }
.page { max-width: 1120px; margin: 0 auto; padding: 28px 24px 80px; }

/* new tab */
.home { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 14vh 16px 60px; }
.logo { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 28px; }
.logo span { color: var(--accent); }
.home-search { width: min(640px, 100%); display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px; border: 1px solid var(--line); border-radius: 26px; background: var(--bg); box-shadow: 0 1px 6px rgba(20,30,45,.08); }
.home-search:focus-within { box-shadow: var(--shadow); border-color: transparent; }
.home-search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: var(--text); }
.home-meta { margin-top: 14px; color: var(--text-3); font-size: 13px; text-align: center; }
.home h2 { font-size: 13px; color: var(--text-3); font-weight: 500; margin: 52px 0 12px; align-self: stretch; max-width: 820px; width: 100%; margin-inline: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; width: 100%; max-width: 820px; }
.card { display: block; padding: 12px 14px; border: 1px solid var(--line-soft); border-radius: var(--radius); text-decoration: none; color: var(--text); background: var(--bg); min-width: 0; }
.card:hover { border-color: var(--line); background: var(--chrome-2); }
.card .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .p { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kbd-help { margin-top: 40px; font-size: 12px; color: var(--text-3); text-align: center; line-height: 2; }
kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--chrome-2); color: var(--text-2); }

/* search results */
.results { max-width: 720px; }
.rs-meta { color: var(--text-3); font-size: 13px; margin-bottom: 22px; }
.fix { color: var(--text-2); font-size: 15px; margin: -10px 0 22px; line-height: 1.7; }
.fix b { font-weight: 600; color: var(--text); }
.fix a { color: var(--link); cursor: pointer; text-decoration: none; }
.fix a:hover { text-decoration: underline; }
.fix .sub { font-size: 13px; color: var(--text-3); }
.hit { margin-bottom: 28px; }
.hit .crumb { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; }
.hit .crumb .badge { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--chrome-2); border: 1px solid var(--line-soft); display: grid; place-items: center; color: var(--accent); }
.hit .crumb .path { overflow: hidden; text-overflow: ellipsis; }
.hit a.title { display: inline-block; font-size: 19px; line-height: 1.35; color: var(--link); text-decoration: none; margin: 4px 0 2px; }
.hit a.title:hover { text-decoration: underline; }
.hit .snip { color: var(--text-2); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
.hit .date { color: var(--text-3); margin-right: 6px; }
mark { background: var(--mark); color: var(--mark-text); border-radius: 2px; padding: 0 1px; }
.snip mark { background: none; color: var(--text); font-weight: 700; padding: 0; }
.pager { display: flex; gap: 8px; margin-top: 12px; }
.pager button { border: 1px solid var(--line); background: var(--bg); border-radius: 18px; padding: 6px 16px; cursor: pointer; font-size: 13px; }
.pager button:hover { background: var(--chrome-2); }
.empty { color: var(--text-2); padding: 20px 0; }
.empty ul { color: var(--text-3); font-size: 14px; }

/* document */
.docwrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; }
.toc { position: sticky; top: 24px; align-self: start; max-height: calc(100vh - 160px); overflow-y: auto; font-size: 13px; border-left: 1px solid var(--line-soft); }
.toc .h { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; padding: 0 0 6px 14px; }
.toc a { display: block; padding: 3px 8px 3px 14px; color: var(--text-2); text-decoration: none; border-left: 2px solid transparent; margin-left: -1px; line-height: 1.45; }
.toc a:hover { color: var(--text); }
.toc a.on { color: var(--accent); border-left-color: var(--accent); }
.toc a.l3 { padding-left: 26px; } .toc a.l4, .toc a.l5, .toc a.l6 { padding-left: 38px; }
.docbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-bottom: 14px; margin-bottom: 8px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; color: var(--text-3); }
.docbar .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-2); overflow-wrap: anywhere; }
.docbar .sp { flex: 1; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 2px 10px; cursor: pointer; font-size: 12px; color: var(--text-2); }
.chip:hover { background: var(--chrome-2); color: var(--text); }
.content { max-width: 780px; overflow-wrap: anywhere; }
.content h1 { font-size: 30px; line-height: 1.3; margin: 18px 0 16px; letter-spacing: -.01em; }
.content h2 { font-size: 22px; margin: 36px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); }
.content h3 { font-size: 18px; margin: 28px 0 8px; }
.content h1, .content h2, .content h3, .content h4 { scroll-margin-top: 16px; }
.content a { color: var(--link); }
.content code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
.content pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
.content pre code { background: none; padding: 0; }
.content blockquote { margin: 0; padding: 2px 16px; border-left: 3px solid var(--line); color: var(--text-2); }
.content table { border-collapse: collapse; display: block; overflow-x: auto; }
.content th, .content td { border: 1px solid var(--line); padding: 6px 12px; }
.content th { background: var(--chrome-2); }
.content img { max-width: 100%; }
.content mark.hl { scroll-margin-top: 80px; }
.htmlframe { width: 100%; height: 75vh; border: 1px solid var(--line-soft); border-radius: 8px; background: #fff; }
.note { font-size: 12px; color: var(--text-3); margin-top: 6px; }
.err { padding: 60px 0; text-align: center; color: var(--text-2); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 100; }
.toast.show { opacity: 1; }

/* モード C: 選んだフォルダ */
.roots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 4px 0 6px; }
.root-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--bg); }
.root-chip.warn { border-color: #d9a400; }
.root-chip small { color: var(--text-3); }
.root-chip button { border: 0; background: none; color: var(--text-3); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 50%; }
.root-chip button:hover { background: var(--chrome-2); color: var(--text); }
.chip.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-size: 13px; padding: 4px 14px; }
.home-note { max-width: 560px; margin: 4px auto 0; text-align: center; color: var(--text-3); font-size: 12.5px; line-height: 1.7; }

@media (max-width: 760px) {
  .docwrap { grid-template-columns: 1fr; }
  .toc { display: none; }
  .page { padding: 20px 16px 60px; }
  .status .lbl { display: none; }
  .tab { flex-basis: 140px; }
  .navbtn.fwd, .navbtn.reload { display: none; }
}
</style>
</head>
<body>
<div id="chrome">
  <div class="tabstrip" id="tabs"></div>
  <div class="toolbar">
    <button class="navbtn back" id="back" title="戻る (Alt+←)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <button class="navbtn fwd" id="fwd" title="進む (Alt+→)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button class="navbtn reload" id="reload" title="再読み込み (Alt+R)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <div class="omni">
      <div class="omni-box">
        <span class="scheme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <input id="omni" autocomplete="off" spellcheck="false" placeholder="ドキュメントを検索、または lb:// を入力">
      </div>
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="status" id="status" title="索引の状態"><span class="dot" id="dot"></span><span class="lbl" id="statusLbl">—</span></div>
    <button class="navbtn" id="reindex" title="索引を更新"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/><path d="M17 14v6M14 17h6"/></svg></button>
  </div>
</div>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script src="mode-c.js"></script>
<script src="app.js"></script>
</body>
</html>
